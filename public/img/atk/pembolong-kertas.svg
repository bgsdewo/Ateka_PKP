<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Hole Punch Machine Body -->
    <rect x="32" y="80" width="96" height="36" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Metal Handle lever -->
    <path d="M 40,84 L 56,46 Q 80,40 104,46 L 120,84" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <!-- Punch pins cylinders -->
    <rect x="54" y="70" width="10" height="14" rx="2" fill="#94a3b8"/>
    <rect x="96" y="70" width="10" height="14" rx="2" fill="#94a3b8"/>
    <!-- Paper guide ruler extending left -->
    <line x1="24" y1="112" x2="136" y2="112" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  </g>
</svg>