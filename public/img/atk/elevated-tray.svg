<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- 3 Tier Document Tray -->
    <!-- Tier 1 Top -->
    <polygon points="34,54 126,54 116,42 44,42" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Tier 2 Middle -->
    <polygon points="34,82 126,82 116,70 44,70" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Tier 3 Bottom -->
    <polygon points="34,110 126,110 116,98 44,98" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Metal side stands -->
    <line x1="40" y1="36" x2="32" y2="122" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="36" x2="128" y2="122" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  </g>
</svg>