<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Heavy Binder -->
    <polygon points="40,30 120,30 120,130 40,130" fill="#1e3a8a" stroke="#172554" stroke-width="2"/>
    <!-- Spine -->
    <rect x="40" y="30" width="26" height="100" fill="#1d4ed8" stroke="#172554" stroke-width="1.5"/>
    <!-- Metal finger ring -->
    <circle cx="53" cy="94" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <!-- Label Window with paper insert -->
    <rect x="46" y="44" width="14" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Metal corner protectors -->
    <polygon points="40,120 40,130 50,130" fill="#94a3b8"/>
    <polygon points="110,130 120,130 120,120" fill="#94a3b8"/>

  </g>
</svg>