<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Battery 1 (AA) -->
    <rect x="42" y="44" width="34" height="76" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Gold Top -->
    <rect x="42" y="44" width="34" height="22" rx="3" fill="#f59e0b"/>
    <!-- Positive terminal -->
    <rect x="53" y="38" width="12" height="6" rx="2" fill="#d97706"/>
    <text x="59" y="86" font-family="Arial" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">AA</text>
    <text x="59" y="58" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

    <!-- Battery 2 (AA behind) -->
    <rect x="84" y="44" width="34" height="76" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="84" y="44" width="34" height="22" rx="3" fill="#f59e0b"/>
    <rect x="95" y="38" width="12" height="6" rx="2" fill="#d97706"/>
    <text x="101" y="86" font-family="Arial" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">AA</text>
    <text x="101" y="58" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

  </g>
</svg>