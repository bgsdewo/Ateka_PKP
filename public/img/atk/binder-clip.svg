<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Black triangular base body -->
    <polygon points="50,116 110,116 80,68" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="46" y="112" width="68" height="9" rx="3" fill="#334155"/>
    <!-- Silver wire handles -->
    <path d="M 68,68 L 68,36 A 12,12 0 0,1 92,36 L 92,68" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="34" r="5" fill="#cbd5e1"/>
    <!-- Clip side wire reflections -->
    <line x1="62" y1="112" x2="74" y2="72" stroke="#64748b" stroke-width="2"/>
    <line x1="98" y1="112" x2="86" y2="72" stroke="#64748b" stroke-width="2"/>

  </g>
</svg>