<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Visual Size Dimension Badge at Top -->
    <rect x="20" y="10" width="120" height="22" rx="11" fill="#1e293b"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">No. 280 • 60 mm</text>

    <!-- Scaled Binder Clip Shape -->
    <g transform="translate(80, 58) scale(1.22) translate(-80, -68)">
      <!-- Black triangular base body -->
      <polygon points="50,96 110,96 80,50" fill="#0f172a" stroke="#000000" stroke-width="2"/>
      <rect x="46" y="93" width="68" height="8" rx="2.5" fill="#334155"/>
      <!-- Silver wire handles -->
      <path d="M 68,50 L 68,20 A 12,12 0 0,1 92,20 L 92,50" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="80" cy="18" r="4.5" fill="#cbd5e1"/>
      <line x1="62" y1="93" x2="74" y2="54" stroke="#64748b" stroke-width="1.8"/>
      <line x1="98" y1="93" x2="86" y2="54" stroke="#64748b" stroke-width="1.8"/>
    </g>

    <!-- Paper Capacity Spec Pill at Bottom -->
    <rect x="28" y="128" width="104" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="80" y="142" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">Kapasitas: ± 200 Lembar</text>

  </g>
</svg>