<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Books supported by bookend -->
    <rect x="36" y="46" width="16" height="74" rx="2" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
    <rect x="54" y="40" width="18" height="80" rx="2" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="74" y="44" width="20" height="76" rx="2" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <!-- Metal Bookend (L-shape) -->
    <path d="M 98,120 L 98,40 A 4,4 0 0,1 104,36 L 108,36 L 108,120 L 126,120" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ground line -->
    <line x1="28" y1="122" x2="132" y2="122" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

  </g>
</svg>