<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- HP GT52/GT53 Refill Bottle -->
    <rect x="52" y="58" width="56" height="70" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <!-- HP Circle Logo -->
    <circle cx="80" cy="92" r="16" fill="#ffffff"/>
    <text x="80" y="97" font-family="Arial" font-size="14" font-style="italic" font-weight="bold" fill="#0284c7" text-anchor="middle">hp</text>
    <!-- Black valve twist cap -->
    <rect x="68" y="40" width="24" height="20" rx="3" fill="#1e293b"/>
    <rect x="74" y="28" width="12" height="12" rx="2" fill="#1e293b"/>

  </g>
</svg>