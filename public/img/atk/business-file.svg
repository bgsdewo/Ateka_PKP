<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Folder Body with Transparent Look -->
    <rect x="34" y="30" width="92" height="104" rx="5" fill="#38bdf8" opacity="0.85" stroke="#0284c7" stroke-width="2"/>
    <!-- Spine fastener clamp (left) -->
    <rect x="34" y="30" width="16" height="104" rx="2" fill="#0369a1"/>
    <!-- Internal Document Visible -->
    <rect x="56" y="42" width="62" height="82" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="62" y1="52" x2="108" y2="52" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="62" y1="62" x2="100" y2="62" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="62" y1="72" x2="104" y2="72" stroke="#94a3b8" stroke-width="1.5"/>

  </g>
</svg>