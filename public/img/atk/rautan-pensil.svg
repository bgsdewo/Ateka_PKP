<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Classic Wedge Sharpener -->
    <polygon points="44,46 116,46 104,114 56,114" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <!-- Pencil cone hole -->
    <ellipse cx="80" cy="46" rx="16" ry="6" fill="#1e293b"/>
    <!-- Metal Razor blade screwed on -->
    <rect x="64" y="56" width="32" height="48" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="3.5" fill="#475569"/>
    <line x1="77" y1="80" x2="83" y2="80" stroke="#ffffff" stroke-width="1"/>

  </g>
</svg>