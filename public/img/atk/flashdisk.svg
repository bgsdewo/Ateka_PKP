<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Sleek Metal Body Flashdisk -->
    <rect x="42" y="60" width="58" height="40" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Keyring Loop -->
    <rect x="32" y="70" width="12" height="20" rx="3" fill="#475569" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="38" cy="80" r="4" fill="#ffffff"/>
    <!-- USB Plug Connector -->
    <rect x="100" y="66" width="28" height="28" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <rect x="110" y="72" width="6" height="6" fill="#0284c7"/>
    <rect x="110" y="82" width="6" height="6" fill="#0284c7"/>
    <!-- Capacity Text Label -->
    <text x="70" y="84" font-family="Arial" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">USB</text>

  </g>
</svg>