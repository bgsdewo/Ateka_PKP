<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Twin looped handles -->
    <circle cx="50" cy="112" r="16" fill="none" stroke="#ef4444" stroke-width="6"/>
    <circle cx="110" cy="112" r="16" fill="none" stroke="#ef4444" stroke-width="6"/>
    <!-- Crossing blades -->
    <path d="M 58,100 L 78,72 L 96,32" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M 102,100 L 82,72 L 64,32" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <!-- Central Pivot Screw -->
    <circle cx="80" cy="72" r="4.5" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>

  </g>
</svg>