<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Classic Stopmap / Folder -->
    <polygon points="30,46 64,46 72,56 130,56 130,126 30,126" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <!-- Folded Flap effect -->
    <polygon points="30,64 130,64 130,126 30,126" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="42" y1="80" x2="80" y2="80" stroke="#ffffff" stroke-width="2"/>
    <line x1="42" y1="92" x2="100" y2="92" stroke="#ffffff" stroke-width="2"/>

  </g>
</svg>