<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- 3D Slanted Box File -->
    <polygon points="36,124 104,124 124,54 124,36 84,36 36,92" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <!-- Front Face -->
    <polygon points="36,92 84,36 84,124 36,124" fill="#0ea5e9" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Spine finger hole -->
    <circle cx="60" cy="102" r="7" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
    <!-- Spine label holder -->
    <rect x="48" y="52" width="24" height="34" rx="2" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="52" y1="60" x2="68" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="52" y1="68" x2="68" y2="68" stroke="#94a3b8" stroke-width="1.5"/>

  </g>
</svg>