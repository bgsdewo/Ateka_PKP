<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Badge Top -->
    <rect x="22" y="12" width="116" height="22" rx="11" fill="#1e293b"/>
    <text x="80" y="27" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Paper Clip Warna</text>

    <!-- Scaled Paper Clip -->
    <g transform="translate(80, 78) rotate(-25) scale(0.8) translate(-80, -78)">
      <path d="M 64,106 L 64,52 A 16,16 0 0,1 96,52 L 96,102 A 11,11 0 0,1 74,102 L 74,65 A 6,6 0 0,1 86,65 L 86,94" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- Bottom spec pill -->
    <rect x="24" y="128" width="112" height="20" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="80" y="142" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">Campur 28 mm</text>

  </g>
</svg>