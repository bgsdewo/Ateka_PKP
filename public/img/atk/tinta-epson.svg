<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Epson 003 / 664 Bottle -->
    <rect x="54" y="62" width="52" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Colored Liquid Body -->
    <rect x="58" y="76" width="44" height="46" rx="4" fill="#0284c7"/>
    <text x="80" y="102" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Epson</text>
    <!-- Keyed Spill-free Nozzle Cap -->
    <rect x="68" y="44" width="24" height="20" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <rect x="74" y="30" width="12" height="14" rx="2" fill="#0369a1"/>

  </g>
</svg>