<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Spine of Spiral Comb Rings -->
    <rect x="28" y="74" width="104" height="12" rx="3" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Circular Comb teeth loops -->
    <g fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <path d="M 36,74 A 8,16 0 0,1 36,44"/>
      <path d="M 48,74 A 8,16 0 0,1 48,44"/>
      <path d="M 60,74 A 8,16 0 0,1 60,44"/>
      <path d="M 72,74 A 8,16 0 0,1 72,44"/>
      <path d="M 84,74 A 8,16 0 0,1 84,44"/>
      <path d="M 96,74 A 8,16 0 0,1 96,44"/>
      <path d="M 108,74 A 8,16 0 0,1 108,44"/>
      <path d="M 120,74 A 8,16 0 0,1 120,44"/>
    </g>

  </g>
</svg>