<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Keyboard Base Body -->
    <rect x="22" y="52" width="116" height="56" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Keys Grid -->
    <g fill="#334155" stroke="#1e293b" stroke-width="0.5">
      <!-- Function Row -->
      <rect x="28" y="58" width="8" height="6" rx="1"/>
      <rect x="38" y="58" width="8" height="6" rx="1"/>
      <rect x="48" y="58" width="8" height="6" rx="1"/>
      <rect x="58" y="58" width="8" height="6" rx="1"/>
      <rect x="70" y="58" width="8" height="6" rx="1"/>
      <rect x="80" y="58" width="8" height="6" rx="1"/>
      <rect x="90" y="58" width="8" height="6" rx="1"/>
      <rect x="100" y="58" width="8" height="6" rx="1"/>
      <rect x="112" y="58" width="18" height="6" rx="1" fill="#ef4444"/>
      <!-- Row 2 -->
      <rect x="28" y="68" width="10" height="8" rx="1"/>
      <rect x="40" y="68" width="10" height="8" rx="1"/>
      <rect x="52" y="68" width="10" height="8" rx="1"/>
      <rect x="64" y="68" width="10" height="8" rx="1"/>
      <rect x="76" y="68" width="10" height="8" rx="1"/>
      <rect x="88" y="68" width="10" height="8" rx="1"/>
      <rect x="100" y="68" width="10" height="8" rx="1"/>
      <rect x="112" y="68" width="18" height="8" rx="1"/>
      <!-- Row 3 Spacebar -->
      <rect x="28" y="80" width="14" height="8" rx="1"/>
      <rect x="44" y="80" width="10" height="8" rx="1"/>
      <rect x="56" y="80" width="48" height="8" rx="1" fill="#475569"/>
      <rect x="106" y="80" width="10" height="8" rx="1"/>
      <rect x="118" y="80" width="12" height="8" rx="1"/>
    </g>

  </g>
</svg>