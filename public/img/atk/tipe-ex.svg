<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Ergonomic Tape Mouse Applicator -->
    <path d="M 46,96 C 36,80 40,54 64,44 C 92,32 120,50 120,78 C 120,98 100,112 76,112 C 60,112 50,106 46,96 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Internal twin tape gear spools -->
    <circle cx="68" cy="74" r="14" fill="#3b82f6" opacity="0.8"/>
    <circle cx="94" cy="74" r="9" fill="#60a5fa" opacity="0.8"/>
    <!-- Applicator tip projecting left -->
    <polygon points="46,92 30,102 42,106" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  </g>
</svg>