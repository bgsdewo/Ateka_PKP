<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Voice Dictaphone Body -->
    <rect x="52" y="32" width="56" height="96" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Dual mic capsules top -->
    <rect x="58" y="26" width="16" height="8" rx="2" fill="#94a3b8"/>
    <rect x="86" y="26" width="16" height="8" rx="2" fill="#94a3b8"/>
    <!-- LCD Display Screen -->
    <rect x="60" y="44" width="40" height="26" rx="3" fill="#0284c7"/>
    <text x="80" y="60" font-family="Courier, monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">REC 00:15</text>
    <!-- Big Red Record Button -->
    <circle cx="80" cy="86" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
    <circle cx="80" cy="86" r="3" fill="#ffffff"/>

  </g>
</svg>