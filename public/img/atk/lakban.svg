<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Heavy Duty Black / Brown Tape Roll in 3D -->
    <ellipse cx="80" cy="94" rx="46" ry="24" fill="#0f172a" stroke="#000000" stroke-width="2"/>
    <ellipse cx="80" cy="62" rx="46" ry="24" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="34" y="62" width="92" height="32" fill="#1e293b"/>
    <!-- Inner Core Hole -->
    <ellipse cx="80" cy="62" rx="22" ry="12" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="80" cy="62" rx="16" ry="8" fill="#f8fafc"/>
    <text x="80" y="82" font-family="Arial" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">LAKBAN</text>

  </g>
</svg>