<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- 3D Paper Ream Box -->
    <polygon points="34,70 94,40 134,60 74,90" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <polygon points="34,70 74,90 74,124 34,104" fill="#0ea5e9" stroke="#0369a1" stroke-width="1.5"/>
    <polygon points="74,90 134,60 134,94 74,124" fill="#38bdf8" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Ream Paper Sheets Stack Line detail -->
    <line x1="34" y1="102" x2="74" y2="122" stroke="#ffffff" stroke-width="1"/>
    <line x1="74" y1="122" x2="134" y2="92" stroke="#ffffff" stroke-width="1"/>
    <!-- Brand / A4 Label -->
    <text x="64" y="68" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" transform="rotate(-15 64 68)">A4</text>
    <text x="96" y="112" font-family="Arial" font-size="10" font-weight="bold" fill="#0369a1">70/80 GSM</text>

  </g>
</svg>