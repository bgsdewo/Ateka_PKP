<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Badge Top -->
    <rect x="20" y="12" width="120" height="22" rx="11" fill="#1e293b"/>
    <text x="80" y="27" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Trigonal Clip No. 3</text>

    <!-- Triangular Paper Clip -->
    <g transform="translate(80, 76) scale(0.95) translate(-80, -76)">
      <path d="M 52,106 L 80,44 L 108,106 L 66,106 L 80,68 L 94,106" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bottom spec pill -->
    <rect x="24" y="128" width="112" height="20" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="80" y="142" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">Bentuk Segitiga (25 mm)</text>

  </g>
</svg>