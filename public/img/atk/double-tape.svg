<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Outer Tape Roll -->
    <circle cx="80" cy="80" r="44" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <circle cx="80" cy="80" r="32" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Cardboard core -->
    <circle cx="80" cy="80" r="18" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <circle cx="80" cy="80" r="12" fill="#f8fafc"/>
    <!-- Unpeeled green/white liner strip -->
    <path d="M 80,36 C 110,36 128,52 132,74 L 140,70" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>

  </g>
</svg>