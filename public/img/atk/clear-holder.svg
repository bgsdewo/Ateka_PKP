<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Clear holder display book -->
    <rect x="38" y="28" width="84" height="108" rx="6" fill="#059669" stroke="#047857" stroke-width="2"/>
    <rect x="38" y="28" width="18" height="108" rx="2" fill="#065f46"/>
    <!-- Clear plastic inner sheet sheen -->
    <rect x="62" y="40" width="54" height="84" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <line x1="47" y1="46" x2="47" y2="118" stroke="#34d399" stroke-width="3" stroke-dasharray="2,6"/>
    <circle cx="88" cy="80" r="14" fill="#10b981" opacity="0.3"/>

  </g>
</svg>