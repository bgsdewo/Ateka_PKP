<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Hardcover Notebook -->
    <rect x="36" y="32" width="88" height="100" rx="6" fill="#1e3a8a" stroke="#172554" stroke-width="2"/>
    <!-- Spine -->
    <rect x="36" y="32" width="14" height="100" rx="4" fill="#1e40af"/>
    <line x1="50" y1="32" x2="50" y2="132" stroke="#fcd34d" stroke-width="2"/>
    <!-- Gold Ribbon Bookmark -->
    <path d="M 78,32 L 78,82 L 84,76 L 90,82 L 90,32 Z" fill="#f59e0b"/>
    <!-- Front Cover Label Area -->
    <rect x="62" y="56" width="50" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="68" y1="66" x2="106" y2="66" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="68" y1="74" x2="98" y2="74" stroke="#94a3b8" stroke-width="1.5"/>

  </g>
</svg>