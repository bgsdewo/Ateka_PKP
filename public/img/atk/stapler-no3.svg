<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <rect x="24" y="12" width="112" height="22" rx="11" fill="#1e293b"/>
    <text x="80" y="27" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Stapler No. 3</text>

    <g transform="translate(80, 74) scale(1.15) translate(-80, -74)">
      <rect x="30" y="96" width="100" height="14" rx="3" fill="#1e293b"/>
      <polygon points="34,74 122,58 122,96 34,96" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
      <rect x="32" y="68" width="24" height="12" rx="3" fill="#38bdf8"/>
    </g>

    <rect x="20" y="128" width="120" height="20" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="80" y="142" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#0369a1" text-anchor="middle">Kapasitas Besar (30-50 Lembar)</text>

