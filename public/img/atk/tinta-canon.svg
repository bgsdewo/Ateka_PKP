<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Canon Ink Cartridge (PG-745 / CL-746) -->
    <rect x="46" y="44" width="68" height="78" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Top label area -->
    <rect x="52" y="50" width="56" height="34" rx="3" fill="#ef4444"/>
    <text x="80" y="72" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Canon</text>
    <!-- Copper contact electrical points -->
    <rect x="62" y="94" width="36" height="20" rx="2" fill="#f59e0b"/>
    <circle cx="70" cy="104" r="2" fill="#78350f"/>
    <circle cx="80" cy="104" r="2" fill="#78350f"/>
    <circle cx="90" cy="104" r="2" fill="#78350f"/>

  </g>
</svg>