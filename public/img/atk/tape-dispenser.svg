<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Weighted Desk Tape Dispenser -->
    <path d="M 32,112 L 128,112 C 128,112 124,76 112,68 C 100,60 84,60 76,74 L 62,94 L 32,94 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Tape wheel -->
    <circle cx="100" cy="80" r="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="100" cy="80" r="8" fill="#475569"/>
    <!-- Cutting blade tooth on left -->
    <rect x="30" y="90" width="8" height="6" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  </g>
</svg>