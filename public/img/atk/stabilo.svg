<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fee7"/>
      <stop offset="100%" stop-color="#ecfccb"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Flat Chunky Stabilo Boss Body angled -->
    <g transform="rotate(-35 80 80)">
      <rect x="42" y="70" width="68" height="22" rx="4" fill="#a3e635" stroke="#65a30d" stroke-width="2"/>
      <text x="76" y="85" font-family="Arial" font-size="10" font-weight="bold" fill="#3f6212" text-anchor="middle">STABILO</text>
      <!-- Chisel tip -->
      <polygon points="42,73 26,76 26,86 42,89" fill="#84cc16"/>
      <!-- Dark Green base cap -->
      <rect x="110" y="69" width="18" height="24" rx="3" fill="#3f6212"/>
    </g>

  </g>
</svg>