<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- HP Laserjet Toner Cartridge -->
    <rect x="26" y="54" width="108" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Top Grip Handle -->
    <rect x="54" y="44" width="52" height="12" rx="3" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Green OPC Drum roller peeking at bottom -->
    <rect x="36" y="98" width="88" height="8" rx="2" fill="#10b981"/>
    <!-- Gear drive gear on left -->
    <circle cx="32" cy="80" r="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="84" font-family="Arial" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">TONER</text>

  </g>
</svg>