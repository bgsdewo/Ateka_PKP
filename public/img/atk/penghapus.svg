<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Rectangular Eraser with Cardboard sleeve -->
    <g transform="rotate(-15 80 80)">
      <!-- Rubber body -->
      <rect x="36" y="60" width="88" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Blue card sleeve cover -->
      <rect x="36" y="60" width="54" height="40" rx="3" fill="#1e3a8a" stroke="#172554" stroke-width="1.5"/>
      <text x="63" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2B</text>
      <!-- Beveled tip on white rubber side -->
      <line x1="120" y1="60" x2="124" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

  </g>
</svg>