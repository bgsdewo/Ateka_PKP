<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Snowman / Whiteboard Marker angled -->
    <g transform="rotate(-40 80 80)">
      <!-- Marker Body -->
      <rect x="36" y="72" width="76" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="74" y="84" font-family="Arial" font-size="9" font-weight="bold" fill="#1e3a8a" text-anchor="middle">MARKER</text>
      <!-- Chisel Nib -->
      <polygon points="36,74 24,78 24,82 36,86" fill="#2563eb"/>
      <!-- Colored Cap on back -->
      <rect x="112" y="70" width="20" height="20" rx="3" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
      <!-- Cap clip -->
      <rect x="100" y="68" width="22" height="4" rx="1" fill="#1d4ed8"/>
    </g>

  </g>
</svg>