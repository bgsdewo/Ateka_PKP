<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Pistol Grip Packing Tape Gun -->
    <rect x="44" y="68" width="20" height="52" rx="6" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <!-- Big Tape Roll Wheel -->
    <circle cx="94" cy="62" r="28" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
    <circle cx="94" cy="62" r="14" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <!-- Metal serrated blade front -->
    <polygon points="56,42 66,42 64,54 54,54" fill="#94a3b8"/>
    <line x1="56" y1="42" x2="66" y2="42" stroke="#475569" stroke-width="2"/>

  </g>
</svg>