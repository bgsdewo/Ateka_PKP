<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Ergonomic Wireless Mouse -->
    <path d="M 52,70 C 52,42 64,30 80,30 C 96,30 108,42 108,70 L 108,92 C 108,114 96,128 80,128 C 64,128 52,114 52,92 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Left & Right Click split line -->
    <line x1="80" y1="30" x2="80" y2="68" stroke="#0f172a" stroke-width="2"/>
    <!-- Scroll Wheel -->
    <rect x="76" y="44" width="8" height="16" rx="4" fill="#38bdf8"/>
    <!-- Palm palm ergonomic accent -->
    <path d="M 62,94 Q 80,106 98,94" fill="none" stroke="#334155" stroke-width="2"/>

  </g>
</svg>