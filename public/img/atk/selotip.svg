<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Clear Tape Dispenser / Small Roll -->
    <circle cx="80" cy="80" r="42" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="80" cy="80" r="32" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="18" fill="#fcd34d" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="80" cy="80" r="12" fill="#f8fafc"/>
    <!-- Transparent sheen peel -->
    <path d="M 80,38 C 114,38 128,56 132,78 L 138,76" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  </g>
</svg>