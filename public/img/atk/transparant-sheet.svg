<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- OHP Projector Film Sheet with light reflection -->
    <rect x="38" y="28" width="84" height="104" rx="4" fill="#f0f9ff" opacity="0.75" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="42,32 118,32 50,128 42,128" fill="#ffffff" opacity="0.4"/>
    <line x1="50" y1="50" x2="108" y2="50" stroke="#0284c7" stroke-width="2"/>
    <line x1="50" y1="64" x2="94" y2="64" stroke="#0284c7" stroke-width="2"/>

  </g>
</svg>