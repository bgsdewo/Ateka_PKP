<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Round Mesh Pen Cup -->
    <ellipse cx="80" cy="46" rx="34" ry="12" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <rect x="46" y="46" width="68" height="74" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <ellipse cx="80" cy="120" rx="34" ry="12" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Mesh grid dots -->
    <circle cx="60" cy="70" r="2" fill="#64748b"/>
    <circle cx="80" cy="70" r="2" fill="#64748b"/>
    <circle cx="100" cy="70" r="2" fill="#64748b"/>
    <circle cx="70" cy="85" r="2" fill="#64748b"/>
    <circle cx="90" cy="85" r="2" fill="#64748b"/>
    <circle cx="60" cy="100" r="2" fill="#64748b"/>
    <circle cx="80" cy="100" r="2" fill="#64748b"/>
    <circle cx="100" cy="100" r="2" fill="#64748b"/>
    <!-- Pens & Ruler sticking out -->
    <line x1="66" y1="20" x2="72" y2="46" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="82" y1="16" x2="82" y2="46" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="94" y1="22" x2="90" y2="46" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>

  </g>
</svg>