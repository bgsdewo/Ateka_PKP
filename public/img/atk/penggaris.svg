<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Clear / Steel Ruler angled -->
    <g transform="rotate(45 80 80)">
      <rect x="18" y="68" width="124" height="24" rx="3" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
      <!-- Measurement ticks -->
      <line x1="28" y1="68" x2="28" y2="78" stroke="#b45309" stroke-width="1.5"/>
      <line x1="36" y1="68" x2="36" y2="74" stroke="#b45309" stroke-width="1"/>
      <line x1="44" y1="68" x2="44" y2="78" stroke="#b45309" stroke-width="1.5"/>
      <line x1="52" y1="68" x2="52" y2="74" stroke="#b45309" stroke-width="1"/>
      <line x1="60" y1="68" x2="60" y2="78" stroke="#b45309" stroke-width="1.5"/>
      <line x1="68" y1="68" x2="68" y2="74" stroke="#b45309" stroke-width="1"/>
      <line x1="76" y1="68" x2="76" y2="78" stroke="#b45309" stroke-width="1.5"/>
      <line x1="84" y1="68" x2="84" y2="74" stroke="#b45309" stroke-width="1"/>
      <line x1="92" y1="68" x2="92" y2="78" stroke="#b45309" stroke-width="1.5"/>
      <line x1="100" y1="68" x2="100" y2="74" stroke="#b45309" stroke-width="1"/>
      <line x1="108" y1="68" x2="108" y2="78" stroke="#b45309" stroke-width="1.5"/>
      <line x1="116" y1="68" x2="116" y2="74" stroke="#b45309" stroke-width="1"/>
      <line x1="124" y1="68" x2="124" y2="78" stroke="#b45309" stroke-width="1.5"/>
      <text x="76" y="86" font-family="Arial" font-size="7" font-weight="bold" fill="#92400e">30 CM</text>
    </g>

  </g>
</svg>