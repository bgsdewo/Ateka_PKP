<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Brother Ink Refill Bottle (BTD60/BT5000) -->
    <rect x="52" y="60" width="56" height="68" rx="8" fill="#0f172a" stroke="#000000" stroke-width="2"/>
    <!-- Clear window ink level -->
    <rect x="58" y="70" width="44" height="48" rx="4" fill="#0284c7"/>
    <text x="80" y="98" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Brother</text>
    <!-- Long Nozzle Cap -->
    <rect x="70" y="44" width="20" height="18" rx="2" fill="#334155"/>
    <polygon points="74,44 80,24 86,44" fill="#38bdf8"/>

  </g>
</svg>