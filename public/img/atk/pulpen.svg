<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Professional Ballpoint Pen angled -->
    <g transform="rotate(-45 80 80)">
      <!-- Pen Barrel -->
      <rect x="36" y="75" width="84" height="10" rx="3" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
      <!-- Grip section -->
      <rect x="36" y="75" width="24" height="10" fill="#1e293b"/>
      <line x1="42" y1="75" x2="42" y2="85" stroke="#475569" stroke-width="1"/>
      <line x1="48" y1="75" x2="48" y2="85" stroke="#475569" stroke-width="1"/>
      <line x1="54" y1="75" x2="54" y2="85" stroke="#475569" stroke-width="1"/>
      <!-- Metal Tip -->
      <polygon points="36,75 22,80 36,85" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
      <!-- Ballpoint tip -->
      <circle cx="21" cy="80" r="1.5" fill="#1e293b"/>
      <!-- Clicker Button & Clip -->
      <rect x="120" y="76" width="10" height="8" rx="2" fill="#94a3b8"/>
      <path d="M 120,74 L 88,74 L 88,76 L 120,76" fill="#cbd5e1"/>
    </g>

  </g>
</svg>