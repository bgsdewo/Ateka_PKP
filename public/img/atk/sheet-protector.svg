<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Transparent Plastic Pocket Sleeve -->
    <rect x="42" y="28" width="84" height="104" rx="4" fill="#ffffff" opacity="0.9" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- White Reinforcing Binding Strip on Left -->
    <rect x="42" y="28" width="14" height="104" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <!-- 11 Punch Holes -->
    <circle cx="49" cy="38" r="2.5" fill="#475569"/>
    <circle cx="49" cy="50" r="2.5" fill="#475569"/>
    <circle cx="49" cy="62" r="2.5" fill="#475569"/>
    <circle cx="49" cy="74" r="2.5" fill="#475569"/>
    <circle cx="49" cy="86" r="2.5" fill="#475569"/>
    <circle cx="49" cy="98" r="2.5" fill="#475569"/>
    <circle cx="49" cy="110" r="2.5" fill="#475569"/>
    <circle cx="49" cy="122" r="2.5" fill="#475569"/>

  </g>
</svg>