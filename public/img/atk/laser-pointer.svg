<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Sleek Wireless Presenter -->
    <rect x="64" y="30" width="32" height="100" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Laser emitter top lens -->
    <circle cx="80" cy="30" r="4" fill="#ef4444" filter="url(#softGlow)"/>
    <!-- Laser beam radiating upward -->
    <line x1="80" y1="26" x2="80" y2="10" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3,3"/>
    <!-- Main Presentation / Slide buttons -->
    <circle cx="80" cy="56" r="8" fill="#ef4444"/>
    <circle cx="80" cy="78" r="6" fill="#475569"/>
    <circle cx="80" cy="96" r="6" fill="#475569"/>

  </g>
</svg>