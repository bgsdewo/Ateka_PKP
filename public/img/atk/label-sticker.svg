<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Sticker Sheet Backing -->
    <rect x="36" y="28" width="88" height="104" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Individual Die-cut White Labels -->
    <rect x="44" y="38" width="32" height="20" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="84" y="38" width="32" height="20" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="44" y="64" width="32" height="20" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="84" y="64" width="32" height="20" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="44" y="90" width="32" height="20" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="84" y="90" width="32" height="20" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <!-- Peeling label corner effect -->
    <polygon points="106,90 116,90 116,100" fill="#e2e8f0"/>

  </g>
</svg>