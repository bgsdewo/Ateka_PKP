<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Dual spool ribbon cartridge -->
    <rect x="30" y="58" width="100" height="44" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="54" cy="80" r="14" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <circle cx="54" cy="80" r="5" fill="#f8fafc"/>
    <circle cx="106" cy="80" r="14" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <circle cx="106" cy="80" r="5" fill="#f8fafc"/>
    <!-- Exposed nylon ribbon guide -->
    <path d="M 38,58 L 38,44 L 122,44 L 122,58" fill="none" stroke="#0f172a" stroke-width="3"/>

  </g>
</svg>