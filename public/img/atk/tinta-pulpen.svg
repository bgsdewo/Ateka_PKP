<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Thin Metal Gel Refill Cartridge angled -->
    <g transform="rotate(-40 80 80)">
      <rect x="24" y="78" width="112" height="6" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
      <polygon points="24,78 14,81 24,84" fill="#f59e0b"/>
      <circle cx="13" cy="81" r="1.5" fill="#1e293b"/>
      <rect x="110" y="76" width="26" height="10" rx="2" fill="#2563eb"/>
    </g>

  </g>
</svg>