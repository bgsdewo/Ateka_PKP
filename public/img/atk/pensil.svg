<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Classic Wooden 2B Pencil angled -->
    <g transform="rotate(-40 80 80)">
      <!-- Pencil Body (Yellow/Hex) -->
      <rect x="34" y="74" width="88" height="12" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
      <line x1="34" y1="78" x2="122" y2="78" stroke="#d97706" stroke-width="1"/>
      <line x1="34" y1="82" x2="122" y2="82" stroke="#d97706" stroke-width="1"/>
      <!-- Sharpened Wooden cone -->
      <polygon points="34,74 16,80 34,86" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
      <!-- Graphite Tip -->
      <polygon points="22,78 16,80 22,82" fill="#1e293b"/>
      <!-- Silver Ferrule -->
      <rect x="122" y="74" width="8" height="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
      <!-- Pink Eraser -->
      <rect x="130" y="74" width="12" height="12" rx="2" fill="#f43f5e" stroke="#e11d48" stroke-width="1"/>
    </g>

  </g>
</svg>