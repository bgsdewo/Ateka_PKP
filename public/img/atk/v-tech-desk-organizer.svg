<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Metal Mesh Multi-compartment Caddy -->
    <rect x="30" y="60" width="100" height="62" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <!-- Grid mesh pattern lines -->
    <line x1="30" y1="74" x2="130" y2="74" stroke="#475569" stroke-width="1.5"/>
    <line x1="30" y1="88" x2="130" y2="88" stroke="#475569" stroke-width="1.5"/>
    <line x1="30" y1="102" x2="130" y2="102" stroke="#475569" stroke-width="1.5"/>
    <!-- Dividing slots with pens protruding -->
    <line x1="64" y1="60" x2="64" y2="122" stroke="#1e293b" stroke-width="2"/>
    <line x1="96" y1="60" x2="96" y2="122" stroke="#1e293b" stroke-width="2"/>
    <!-- Pens & Scissors sticking out -->
    <line x1="46" y1="40" x2="46" y2="60" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="54" y1="44" x2="54" y2="60" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="52" r="6" fill="none" stroke="#f59e0b" stroke-width="3"/>

  </g>
</svg>