<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="16" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">

    <!-- Aluminum Body Hub -->
    <rect x="52" y="48" width="56" height="80" rx="8" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <!-- Type-C Cable extending out -->
    <path d="M 80,48 L 80,24 Q 80,18 86,18 L 102,18" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <rect x="102" y="14" width="14" height="8" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
    <!-- Ports on HUB -->
    <rect x="62" y="62" width="36" height="10" rx="2" fill="#0284c7" stroke="#0f172a" stroke-width="1"/>
    <rect x="62" y="78" width="36" height="10" rx="2" fill="#0284c7" stroke="#0f172a" stroke-width="1"/>
    <rect x="66" y="96" width="28" height="7" rx="1.5" fill="#1e293b"/>
    <circle cx="80" cy="116" r="2.5" fill="#22c55e"/>

  </g>
</svg>